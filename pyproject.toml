[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-quantum-core"
version = "0.1.3"
description = "Aetheris Quantum Core — Advanced Systems Instrumentation Suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Aetheris" }]
keywords = ["forensics", "sysadmin", "windows", "instrumentation", "pyqt6"]

# Minimum runtime for the GUI + core telemetry.
dependencies = [
    "PyQt6>=6.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Recommended: unlocks charts, firewall COM, WMI, deeper Win32.
recommended = [
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "PyOpenGL>=3.1",
    "geoip2>=4.7",
]
# Optional forensics engines (large native wheels; may lag new Python releases).
forensics = [
    "capstone>=5.0",
    "keystone-engine>=0.9",
    "memprocfs>=5.0; sys_platform == 'win32'",
]
# Everything.
full = [
    "aetheris-quantum-core[recommended,forensics]",
]
# Test tooling.
test = ["pytest>=7.4", "hypothesis>=6.0", "pytest-qt>=4.2"]
# One-file executable build tooling.
build-exe = ["pyinstaller>=6.0"]

[project.gui-scripts]
# Installs an `aetheris` launcher (GUI, no console window).
aetheris = "aetheris.main:run_app"

[project.scripts]
# Console launcher (prints elevation/bootstrap messages), handy for debugging.
aetheris-console = "run:main"
# Headless forensic capture (reports/plugins; no GUI).
aetheris-cli = "aetheris.cli:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["aetheris*"]

[tool.setuptools.package-data]
aetheris = ["ui/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110          # PyQt6 flag/enum calls are legitimately verbose
target-version = "py310"

[tool.ruff.lint]
# Enforced rule set: pyflakes (F), import order (I), pycodestyle (E),
# pyupgrade (UP), and bugbear (B) -- the families that catch real defects and
# modernization. The opinionated style/security families (SIM/RUF/S/BLE/PLW)
# are intentionally left out: this suite makes many native calls (ctypes, COM,
# winreg) guarded by broad `except`/`pass` on purpose, and its UI strings use
# em-dashes and box-drawing glyphs -- both of which those rules flag as noise.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",  # a few imports sit after a skip-guard / sys.path setup on purpose
    "E741",  # single-letter names (l, i) read fine in tight numeric/loop code
    "B006",  # default-arg value intentionally snapshots state for a closure
    "B007",  # a loop var is sometimes kept for readability even when unused
    "B027",  # `close()` is an optional lifecycle hook, not every backend needs it
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The PyQt6 UI layer is not statically checked: PyQt6's type stubs emit false
# overload / signal-typing errors (QLabel(objectName=...), QByteArray, nullable
# QTableWidgetItem) that don't reflect real bugs.
module = ["aetheris.ui.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# These modules bind Windows DLL handles dynamically via ctypes at runtime
# (attributes attached to WinDLL objects; `WinDLL | None` across the IS_WINDOWS
# guard), which static analysis can't model. They are covered by the Windows
# test suite instead.
module = ["aetheris.core.winapi", "aetheris.core.signing",
          "aetheris.network.procbw", "aetheris.network.etwbw"]
ignore_errors = true

[[tool.mypy.overrides]]
# mypy can't infer the type of a default-argument lambda used to capture a
# closure variable (the deliberate rollback-undo idiom in these modules).
module = ["aetheris.core.autoruns", "aetheris.network.firewall"]
disable_error_code = ["misc"]
