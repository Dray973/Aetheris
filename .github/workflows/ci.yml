name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + test extras)
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Byte-compile all modules
        run: python -m compileall -q aetheris run.py

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  lint:
    name: Lint (ruff + mypy --strict)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linters + typing deps
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.4" "mypy==2.3.1"
          pip install .[test]

      - name: ruff check
        run: ruff check .

      - name: mypy --strict
        run: mypy aetheris
