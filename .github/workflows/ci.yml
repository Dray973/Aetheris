name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native engines (Rust + C++)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # windows-latest ships rustup/cargo and the MSVC toolset, so no
      # third-party toolchain actions are pulled in. Only official actions are
      # used anywhere in this workflow — for a security tool the CI supply
      # chain is part of the threat model.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/aetheris_core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/aetheris_core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust — clippy
        working-directory: native/aetheris_core
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Rust — unit tests
        working-directory: native/aetheris_core
        run: cargo test --release

      - name: Build both engines
        run: powershell -ExecutionPolicy Bypass -File native\build.ps1 -Strict

      - name: C++ — self-tests
        run: powershell -ExecutionPolicy Bypass -File native\aetheris_win\build.ps1 -Tests

      # Hand the built DLLs to the test job rather than rebuilding them per
      # Python version.
      - name: Upload engines
        uses: actions/upload-artifact@v7
        with:
          name: native-engines
          path: dist/*.dll
          if-no-files-found: error

  test:
    name: Test (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    needs: native
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download engines
        uses: actions/download-artifact@v8
        with:
          name: native-engines
          path: dist

      - name: Install (core + test extras)
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Byte-compile all modules
        run: python -m compileall -q aetheris run.py

      # Without this the suite still passes with the engines unusable: every
      # native test skips and every native/Python parity test compares Python
      # against Python. A silent-green run is the failure mode these guards
      # exist to prevent, so assert the engines are live before testing.
      - name: Assert the engines loaded
        run: >
          python -c "from aetheris.native import core, win;
          assert core.available(), 'aetheris_core.dll did not load';
          assert win.available(), 'aetheris_win.dll did not load';
          print('both engines live')"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  lint:
    name: Lint (ruff + mypy --strict)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linters + typing deps
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.4" "mypy==2.3.1"
          pip install .[test]

      - name: ruff check
        run: ruff check .

      - name: mypy --strict
        run: mypy aetheris

  # Cross-platform job: the pure layers (parsers, findings engine, audit,
  # dry-run, rollback, reports) must behave identically off Windows, so cloud
  # and Linux dev sessions can verify their own changes. Windows-only tests
  # skip here by design; the Windows jobs above remain the source of truth for
  # the native engines.
  linux:
    name: Cross-platform (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Runtime libraries PySide6 needs for the offscreen Qt platform.
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install (core + test extras)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.4" "mypy==2.3.1"
          pip install .[test]

      - name: Rust — clippy + unit tests (portable engine)
        working-directory: native/aetheris_core
        run: |
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release

      - name: ruff check
        run: ruff check .

      # Type-check as Windows so winreg/ctypes.windll narrow the same way they
      # do on the Windows lint job.
      - name: mypy --strict (win32 target)
        run: mypy --platform win32 aetheris

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
