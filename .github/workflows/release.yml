name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  build:
    name: Build Windows downloadables
    runs-on: windows-latest
    env:
      # Set these repo secrets to Authenticode-sign the outputs (optional).
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[recommended,forensics,build-exe]"

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean aetheris.spec

      - name: Smoke-launch the executable (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\AetherisQuantumCore.exe `
                             -ArgumentList '--no-elevate' -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            throw "Executable exited early with code $($p.ExitCode)"
          }
          Write-Host "Executable is running (PID $($p.Id)); stopping it."
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $p.Id -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (AetherisSetup.exe)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\aetheris.iss'

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item dist\AetherisQuantumCore.exe artifacts\
          Copy-Item installer\Output\AetherisSetup.exe artifacts\

      - name: Sign binaries (optional — needs SIGN_PFX_BASE64 secret)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'aetheris-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse `
                  -Filter signtool.exe | Where-Object FullName -match '\\x64\\' |
                  Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($f in 'artifacts\AetherisQuantumCore.exe','artifacts\AetherisSetup.exe') {
            & $st.FullName sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $f
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $f" }
          }
          Remove-Item $pfx -Force

      - name: Generate update manifest (version.json)
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v','V')
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0" }
          $hash = (Get-FileHash artifacts\AetherisQuantumCore.exe -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/latest/download/AetherisQuantumCore.exe"
          $m = [ordered]@{ version = $ver; url = $url; notes = "Aetheris $tag"; sha256 = $hash }
          $m | ConvertTo-Json | Set-Content artifacts\version.json -Encoding ascii
          Get-Content artifacts\version.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-windows
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          artifacts/AetherisQuantumCore.exe
          artifacts/AetherisSetup.exe
          artifacts/version.json
          --title "Aetheris Quantum Core ${{ github.ref_name }}"
          --generate-notes
