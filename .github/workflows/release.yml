name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  build:
    name: Build Windows downloadables
    runs-on: windows-latest
    env:
      # Azure Trusted Signing: set these repo secrets to sign the release
      # binaries with a SmartScreen-trusted cert. Unset => unsigned build.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[recommended,forensics,build-exe]"

      - name: Build the API-monitor agent DLL (MSVC)
        run: powershell -ExecutionPolicy Bypass -File agent\build.ps1

      - name: Build the native scan lib (Rust)
        continue-on-error: true   # optional accelerator — nativescan falls back to pure Python
        run: powershell -ExecutionPolicy Bypass -File native\build.ps1

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean aetheris.spec

      - name: Smoke-launch the executable (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\AetherisQuantumCore.exe `
                             -ArgumentList '--no-elevate' -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            throw "Executable exited early with code $($p.ExitCode)"
          }
          Write-Host "Executable is running (PID $($p.Id)); stopping it."
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $p.Id -Force

      - name: Sign the app exe (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (AetherisSetup.exe)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\aetheris.iss'

      - name: Sign the installer (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installer\Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item dist\AetherisQuantumCore.exe artifacts\
          Copy-Item installer\Output\AetherisSetup.exe artifacts\
          Copy-Item dist\aetheris_agent.dll artifacts\

      - name: Generate update manifest (version.json)
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v','V')
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0" }
          # Publish binaries to a separate PUBLIC repo if configured (keeps the
          # source repo private). Set the RELEASES_REPO repo variable to enable.
          $repo = "${{ vars.RELEASES_REPO }}"
          if ([string]::IsNullOrWhiteSpace($repo)) { $repo = "${{ github.repository }}" }
          $hash = (Get-FileHash artifacts\AetherisQuantumCore.exe -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/$repo/releases/latest/download/AetherisQuantumCore.exe"
          # Publish the injected agent DLL + its hash so a compiler-less source
          # install can fetch a verified agent (see forensics/apimonitor.py).
          $agentHash = (Get-FileHash artifacts\aetheris_agent.dll -Algorithm SHA256).Hash.ToLower()
          $agentUrl = "https://github.com/$repo/releases/latest/download/aetheris_agent.dll"
          $m = [ordered]@{
            version = $ver; url = $url; notes = "Aetheris $tag"; sha256 = $hash
            agent = [ordered]@{ url = $agentUrl; sha256 = $agentHash }
          }
          $m | ConvertTo-Json | Set-Content artifacts\version.json -Encoding ascii
          Get-Content artifacts\version.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-windows
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Use a PAT (RELEASES_TOKEN) to publish to the public releases repo;
          # otherwise fall back to the built-in token on this repo.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN != '' && secrets.RELEASES_TOKEN || github.token }}
        run: |
          $repo = "${{ vars.RELEASES_REPO }}"
          $repoArg = if ([string]::IsNullOrWhiteSpace($repo)) { @() } else { @('--repo', $repo) }
          gh release create ${{ github.ref_name }} `
            artifacts/AetherisQuantumCore.exe `
            artifacts/AetherisSetup.exe `
            artifacts/aetheris_agent.dll `
            artifacts/version.json `
            --title "Aetheris Quantum Core ${{ github.ref_name }}" `
            --generate-notes @repoArg
