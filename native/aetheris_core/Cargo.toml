[package]
name = "aetheris_core"
version = "0.1.0"
edition = "2021"
description = "Aetheris native analysis core — entropy, search, PE parsing/carving, region classification, hashing (C ABI)"

[lib]
name = "aetheris_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
